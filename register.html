<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDC - Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Menu -->
    <header>
        <div class="logo">Gramin Development Center</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="register.html">Online Apply</a></li>
            </ul>
        </nav>
    </header>

    <!-- Registration Section -->
    <section class="section">
        <h2>Student Admission Form</h2>
        <p>Gramin Development Center training programs ke liye niche diye gaye form ko bharein.</p>
        
        <form class="contact-form" style="text-align: left;">
            <label>Full Name (Pura Naam):</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Mobile Number:</label>
            <input type="tel" placeholder="Enter 10 digit mobile number" required>

            <label>Select Course (Course Chunein):</label>
            <select style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; margin-bottom: 15px;">
                <option>Digital Literacy (Computer Basic)</option>
                <option>Skill Development Training</option>
                <option>Smart Agriculture Techniques</option>
            </select>

            <label>Address (Pata):</label>
            <textarea placeholder="Enter your full address" rows="4" required></textarea>

            <button type="submit" class="btn" style="width: 100%;">Submit Application</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Gramin Development Center. All Rights Reserved.</p>
    </footer>

</body>
</html>
